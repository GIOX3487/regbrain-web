name: Deploy Supabase Edge Functions
# Deploya SOLO le funzioni già in produzione (più le due di ingestione normativa), così un
# push non attiva per errore funzioni presenti nel repo ma mai pubblicate.
# Tutte le funzioni gestiscono l'autenticazione internamente: --no-verify-jwt
# riproduce la configurazione attuale del progetto.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ndwozjlasabsdfqcyeoy
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # La CLI impacchetta le funzioni con l'immagine edge-runtime scaricata da ghcr.io, che
      # dai runner condivisi risponde spesso "toomanyrequests" ai primi tentativi e poi si sblocca
      # in meno di un minuto. Le prime funzioni della lista fallivano per questo: ogni deploy viene
      # quindi ritentato fino a quattro volte, con attesa, solo quando l'errore è quello del registro.
      - name: Deploy production functions
        run: |
          deploy() {
            local fn="$1" attempt
            for attempt in 1 2 3 4; do
              if supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt > "/tmp/$fn.log" 2>&1; then
                return 0
              fi
              if [ "$attempt" -lt 4 ] && grep -q "toomanyrequests" "/tmp/$fn.log"; then
                echo "Registro immagini saturo, nuovo tentativo tra 30 s ($attempt/4)."; sleep 30
              else
                return 1
              fi
            done
            return 1
          }
          failed=""
          for fn in \
            rag-query ingest-eurlex-formex ingest-web-source index-normative-documents \
            verify-site-password start-demo gap-analysis code-compliance ai-compliance-copilot \
            process-document predictive-analytics generate-audit-document \
            generate-policy generate-risk-register generate-benchmark \
            generate-acn-report translate-content initialize-monitoring \
            orchestrate-remediation generate-embedding extract-requirements \
            balance-requirements cleanup-requirements restructure-chunks \
            rag-eval continuous-monitoring-scan; do
            echo "::group::$fn"
            if deploy "$fn"; then
              cat "/tmp/$fn.log"; echo "::notice title=$fn::deploy ok"
            else
              cat "/tmp/$fn.log"; failed="$failed $fn"
              echo "::error title=$fn::$(tail -c 600 "/tmp/$fn.log" | tr '\n' ' ')"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Deploy falliti:$failed"; exit 1; fi
