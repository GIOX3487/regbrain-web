name: Carica corpus normativo nel RAG
# Quando su main cambia un testo in corpus/ (leggi italiane in XML Akoma Ntoso o Markdown),
# lo carica nel RAG tramite la funzione ingest-web-source con la chiave di servizio,
# letta al momento dall'API di gestione Supabase e mai scritta nei log.
on:
  push:
    branches: [main]
    paths:
      - 'corpus/**'
  workflow_dispatch:
    inputs:
      files:
        description: 'File da caricare (separati da spazio). Vuoto: tutti quelli in corpus/'
        required: false
        default: ''
concurrency:
  group: corpus-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ndwozjlasabsdfqcyeoy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attendi il deploy delle funzioni
        # Se lo stesso push aggiorna anche le funzioni, il caricamento parte dopo il loro deploy.
        run: sleep 150
      - name: Scegli i file
        id: pick
        env:
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_FILES" ]; then files="$INPUT_FILES"; else files=$(find corpus -type f \( -name '*.xml' -o -name '*.md' \) ! -name 'README.md' | sort | tr '\n' ' '); fi
          else
            files=$(git diff --name-only HEAD~1 HEAD -- corpus | grep -E '\.(xml|md)$' | grep -v 'README.md' | tr '\n' ' ' || true)
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "File: $files"
      - name: Carica
        if: steps.pick.outputs.files != ''
        env:
          FILES: ${{ steps.pick.outputs.files }}
        run: |
          code=$(curl -s -o keys.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          echo "api-keys: HTTP $code"
          # Elenca solo nome e tipo delle chiavi, mai il valore.
          node -e 'const k=require("./keys.json");if(!Array.isArray(k)){console.log("risposta inattesa");process.exit(1)}for(const x of k)console.log(" chiave:",x.name,x.type,x.api_key?"(valore disponibile)":"(valore non rivelato)")'
          # Tutte le chiavi segrete candidate, mascherate: lo script tiene la prima accettata.
          SERVICE_KEY=$(node -e 'const k=require("./keys.json");const c=k.filter(x=>x.api_key&&x.type!=="publishable"&&!String(x.name).includes("anon"));process.stdout.write(c.map(x=>x.api_key).join("\n"))')
          rm -f keys.json
          if [ -z "$SERVICE_KEY" ]; then echo "::error::Nessuna chiave di servizio disponibile"; exit 1; fi
          while IFS= read -r k; do [ -n "$k" ] && echo "::add-mask::$k"; done <<< "$SERVICE_KEY"
          SUPABASE_URL="https://$PROJECT_REF.supabase.co" SERVICE_KEY="$SERVICE_KEY" node scripts/ingest-corpus.mjs $FILES
