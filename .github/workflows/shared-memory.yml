name: Shared memory

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  memory:
    name: Shared memory required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted validator from target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Read proposed files as data only
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Never install dependencies or execute scripts from candidate here.
      - name: Validate proposed memory with trusted code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node trusted/deployment/check-shared-memory.mjs --repo candidate --base "$BASE_SHA" --head "$HEAD_SHA"
